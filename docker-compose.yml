version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cargopulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cargopulse}
      POSTGRES_USER: ${POSTGRES_USER:-cargopulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargopulse_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargopulse_user} -d ${POSTGRES_DB:-cargopulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cargopulse_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cargopulse_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-cargopulse_dev_super_secret_key_change_in_production_minimum_32_characters_long}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cargopulse_user}:${POSTGRES_PASSWORD:-cargopulse_dev_password}@postgres:5432/${POSTGRES_DB:-cargopulse}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-cargopulse_user}:${POSTGRES_PASSWORD:-cargopulse_dev_password}@postgres:5432/${POSTGRES_DB:-cargopulse}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cargopulse_celery_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-cargopulse_dev_super_secret_key_change_in_production_minimum_32_characters_long}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cargopulse_user}:${POSTGRES_PASSWORD:-cargopulse_dev_password}@postgres:5432/${POSTGRES_DB:-cargopulse}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-cargopulse_user}:${POSTGRES_PASSWORD:-cargopulse_dev_password}@postgres:5432/${POSTGRES_DB:-cargopulse}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q default,telemetry,notifications

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cargopulse_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redisdata:
